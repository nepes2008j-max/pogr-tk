<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="utf-8">
<title>2D/3D model</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0e3a3a;color:#fff;
            font-family:Arial,Helvetica,sans-serif}
  #bar{display:flex;align-items:center;gap:16px;box-sizing:border-box;
       height:44px;padding:10px 16px;background:#0b2e2e;
       border-bottom:1px solid #1d5c5c;font-size:14px}
  #bar a{color:#9fe3e3;text-decoration:none}
  #bar a:hover{text-decoration:underline}
  #name{color:#cfeaea}
  #stage{position:absolute;top:44px;left:0;right:0;bottom:0}
  #stage>*{display:block}   /* Ruffle-iň elementi inline — aşakda 4px boşluk galdyrýar */
  #err{padding:24px;font-size:15px;line-height:1.5;max-width:760px}
  #err code{background:#062020;padding:2px 6px;border-radius:3px}
</style>
</head>
<body>
<div id="bar"><a href="#" onclick="history.back();return false;">&#9664; Yza</a><span id="name"></span></div>
<div id="stage"></div>
<div id="err" style="display:none">
  <p><b>Model açylmady.</b></p>
  <p>Flash modelleri diňe ýerli web-serwer arkaly açylanda işleýär.
     Diskiň kök bukjasyndaky <code>BASLAT.sh</code> (Linux) ýa-da
     <code>BASLAT.bat</code> (Windows) faýlyny işlediň — brauzer awtomat açylar
     we ähli modeller işlär.</p>
</div>
<script src="ruffle/ruffle.js"></script>
<script>
(function () {
  function qp(n) {
    var m = new RegExp('[?&]' + n + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  }
  var f = qp('f');
  var ru = /^ru\//.test(f || '');
  var T = ru
    ? {back:'\u25C0 \u041D\u0430\u0437\u0430\u0434', none:' \u2014 \u0444\u0430\u0439\u043B \u043D\u0435 \u0443\u043A\u0430\u0437\u0430\u043D',
       t1:'\u041C\u043E\u0434\u0435\u043B\u044C \u043D\u0435 \u043E\u0442\u043A\u0440\u044B\u043B\u0430\u0441\u044C.',
       t2:'Flash-\u043C\u043E\u0434\u0435\u043B\u0438 \u0440\u0430\u0431\u043E\u0442\u0430\u044E\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u043F\u0440\u0438 \u043E\u0442\u043A\u0440\u044B\u0442\u0438\u0438 \u0447\u0435\u0440\u0435\u0437 \u043B\u043E\u043A\u0430\u043B\u044C\u043D\u044B\u0439 \u0432\u0435\u0431-\u0441\u0435\u0440\u0432\u0435\u0440. \u0417\u0430\u043F\u0443\u0441\u0442\u0438\u0442\u0435 \u0444\u0430\u0439\u043B '}
    : null;
  if (T) {
    document.querySelector('#bar a').innerHTML = T.back;
    var ps = document.querySelectorAll('#err p');
    ps[0].innerHTML = '<b>' + T.t1 + '</b>';
    ps[1].innerHTML = T.t2 + '<code>BASLAT.sh</code> / <code>BASLAT.bat</code>.';
  }
  if (!f) { document.getElementById('name').textContent = T ? T.none : ' — faýl görkezilmedi'; return; }
  var short = f.split('/').pop();
  document.getElementById('name').textContent = ' — ' + decodeURIComponent(short);
  document.title = decodeURIComponent(short);

  if (location.protocol === 'file:') {
    document.getElementById('stage').style.display = 'none';
    document.getElementById('err').style.display = 'block';
    return;
  }
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: 'on',
    unmuteOverlay: 'hidden',
    contextMenu: true,
    letterbox: 'on',
    scale: 'showAll',
    quality: 'high',
    warnOnUnsupportedContent: false
  };
  window.addEventListener('load', function () {
    var ruffle = window.RufflePlayer.newest();
    var player = ruffle.createPlayer();
    player.style.width = '100%';
    player.style.height = '100%';
    document.getElementById('stage').appendChild(player);
    player.load(f).catch(function () {
      document.getElementById('stage').style.display = 'none';
      document.getElementById('err').style.display = 'block';
    });
  });
})();
</script>
</body>
</html>
